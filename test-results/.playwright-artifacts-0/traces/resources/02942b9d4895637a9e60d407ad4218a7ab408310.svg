<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Navy background -->
  <rect width="64" height="64" rx="10" fill="#0D1B3E"/>
  <!-- Gold circle frame -->
  <circle cx="32" cy="36" r="18" stroke="#C9A84C" stroke-width="1.4" fill="none"/>
  <!-- Crown / light rays above -->
  <line x1="32" y1="8" x2="32" y2="16" stroke="#C9A84C" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="22" y1="12" x2="24.5" y2="18.5" stroke="#C9A84C" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
  <line x1="42" y1="12" x2="39.5" y2="18.5" stroke="#C9A84C" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
  <!-- EB monogram -->
  <text x="32" y="41" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-weight="700" font-size="15" letter-spacing="1.5" fill="#C9A84C">EB</text>
</svg>
