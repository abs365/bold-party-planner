<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!--
    ELBOLD MONOGRAM — Starburst mark only (64x64)
    Use as: app icon, social profile avatar, embossed stamp
  -->

  <!-- Starburst: 8 primary rays -->
  <line x1="32" y1="32" x2="32" y2="2"    stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="54.6" y2="9.4" stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="62" y2="32"   stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="54.6" y2="54.6" stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="32" y2="62"   stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="9.4"  y2="54.6" stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="2"   y2="32"   stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="9.4"  y2="9.4"  stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>

  <!-- Starburst: 8 secondary rays -->
  <line x1="32" y1="32" x2="32" y2="15"   stroke="#D4AF37" stroke-width="0.9" stroke-linecap="round" opacity="0.38"/>
  <line x1="32" y1="32" x2="44" y2="20"   stroke="#D4AF37" stroke-width="0.9" stroke-linecap="round" opacity="0.38"/>
  <line x1="32" y1="32" x2="49" y2="32"   stroke="#D4AF37" stroke-width="0.9" stroke-linecap="round" opacity="0.38"/>
  <line x1="32" y1="32" x2="44" y2="44"   stroke="#D4AF37" stroke-width="0.9" stroke-linecap="round" opacity="0.38"/>
  <line x1="32" y1="32" x2="32" y2="49"   stroke="#D4AF37" stroke-width="0.9" stroke-linecap="round" opacity="0.38"/>
  <line x1="32" y1="32" x2="20" y2="44"   stroke="#D4AF37" stroke-width="0.9" stroke-linecap="round" opacity="0.38"/>
  <line x1="32" y1="32" x2="15" y2="32"   stroke="#D4AF37" stroke-width="0.9" stroke-linecap="round" opacity="0.38"/>
  <line x1="32" y1="32" x2="20" y2="20"   stroke="#D4AF37" stroke-width="0.9" stroke-linecap="round" opacity="0.38"/>

  <!-- Centre disc -->
  <circle cx="32" cy="32" r="17"   fill="#0B1F4D"/>
  <circle cx="32" cy="32" r="16.2" stroke="#D4AF37" stroke-width="0.6" fill="none" opacity="0.32"/>

  <!-- EB monogram -->
  <text
    x="32" y="38"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-weight="700"
    font-size="16"
    letter-spacing="2"
    fill="#D4AF37"
  >EB</text>
</svg>
