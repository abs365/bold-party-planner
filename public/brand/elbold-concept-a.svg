<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" fill="none">
  <!--
    CONCEPT A — REFINED LUXURY
    Philosophy: The existing EB emblem, refined. Cleaner proportions,
    slimmer lines, more precise geometry. Think Cartier, Rolex.
    Removes the navy badge background — the mark stands alone.
  -->

  <!-- Outer precision ring — double band -->
  <circle cx="30" cy="30" r="26" stroke="#D4AF37" stroke-width="0.6" fill="none"/>
  <circle cx="30" cy="30" r="22.5" stroke="#D4AF37" stroke-width="0.3" fill="none" opacity="0.4"/>

  <!-- Crown rays — 5 geometric rays, precise angles -->
  <!-- Centre top -->
  <line x1="30" y1="4" x2="30" y2="10.5" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 45° left -->
  <line x1="11.4" y1="11.4" x2="16.3" y2="16.3" stroke="#D4AF37" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <!-- 45° right -->
  <line x1="48.6" y1="11.4" x2="43.7" y2="16.3" stroke="#D4AF37" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <!-- 22.5° left -->
  <line x1="5.4" y1="22" x2="10.8" y2="24.6" stroke="#D4AF37" stroke-width="0.6" stroke-linecap="round" opacity="0.3"/>
  <!-- 22.5° right -->
  <line x1="54.6" y1="22" x2="49.2" y2="24.6" stroke="#D4AF37" stroke-width="0.6" stroke-linecap="round" opacity="0.3"/>

  <!-- EB monogram — refined serif, generous letter-spacing -->
  <text
    x="30" y="36"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="400"
    font-size="14"
    letter-spacing="3"
    fill="#D4AF37"
  >EB</text>

  <!-- Thin horizontal rule under monogram -->
  <line x1="17" y1="40" x2="43" y2="40" stroke="#D4AF37" stroke-width="0.4" opacity="0.4"/>

  <!-- ELBOLD wordmark — deep navy, wide tracking -->
  <text
    x="76" y="25"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="19"
    letter-spacing="5"
    fill="#0B1F4D"
  >ELBOLD</text>

  <!-- EVENTS subtitle — gold, ultra-wide tracking -->
  <text
    x="76" y="42"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="400"
    font-size="8"
    letter-spacing="7"
    fill="#C9A84C"
    opacity="0.8"
  >EVENTS</text>
</svg>
