<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 72" fill="none">
  <!--
    ELBOLD EMAIL HEADER LOGO
    Proportioned for email header use (600px wide container, renders at 480x72).
    White wordmark on transparent — place over navy email header background.
  -->

  <!-- Starburst rays (primary) -->
  <line x1="36" y1="36" x2="36" y2="6"    stroke="#D4AF37" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <line x1="36" y1="36" x2="57.2" y2="14.8" stroke="#D4AF37" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <line x1="36" y1="36" x2="66" y2="36"   stroke="#D4AF37" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <line x1="36" y1="36" x2="57.2" y2="57.2" stroke="#D4AF37" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <line x1="36" y1="36" x2="36" y2="66"   stroke="#D4AF37" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <line x1="36" y1="36" x2="14.8" y2="57.2" stroke="#D4AF37" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <line x1="36" y1="36" x2="6"   y2="36"   stroke="#D4AF37" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <line x1="36" y1="36" x2="14.8" y2="14.8" stroke="#D4AF37" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>

  <!-- Starburst rays (secondary) -->
  <line x1="36" y1="36" x2="36" y2="18"   stroke="#D4AF37" stroke-width="0.7" stroke-linecap="round" opacity="0.35"/>
  <line x1="36" y1="36" x2="48.7" y2="23.3" stroke="#D4AF37" stroke-width="0.7" stroke-linecap="round" opacity="0.35"/>
  <line x1="36" y1="36" x2="54" y2="36"   stroke="#D4AF37" stroke-width="0.7" stroke-linecap="round" opacity="0.35"/>
  <line x1="36" y1="36" x2="48.7" y2="48.7" stroke="#D4AF37" stroke-width="0.7" stroke-linecap="round" opacity="0.35"/>
  <line x1="36" y1="36" x2="36" y2="54"   stroke="#D4AF37" stroke-width="0.7" stroke-linecap="round" opacity="0.35"/>
  <line x1="36" y1="36" x2="23.3" y2="48.7" stroke="#D4AF37" stroke-width="0.7" stroke-linecap="round" opacity="0.35"/>
  <line x1="36" y1="36" x2="18" y2="36"   stroke="#D4AF37" stroke-width="0.7" stroke-linecap="round" opacity="0.35"/>
  <line x1="36" y1="36" x2="23.3" y2="23.3" stroke="#D4AF37" stroke-width="0.7" stroke-linecap="round" opacity="0.35"/>

  <!-- Centre disc -->
  <circle cx="36" cy="36" r="16" fill="rgba(255,255,255,0.1)"/>
  <circle cx="36" cy="36" r="15.3" stroke="#D4AF37" stroke-width="0.5" fill="none" opacity="0.35"/>

  <!-- EB monogram -->
  <text
    x="36" y="41.5"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-weight="700"
    font-size="14.5"
    letter-spacing="1.5"
    fill="#D4AF37"
  >EB</text>

  <!-- Wordmark — white for email headers -->
  <text
    x="90" y="29"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="22"
    letter-spacing="5"
    fill="rgba(255,255,255,0.94)"
  >ELBOLD</text>

  <!-- Thin rule -->
  <line x1="90" y1="36" x2="270" y2="36" stroke="#D4AF37" stroke-width="0.4" opacity="0.32"/>

  <!-- EVENTS caption -->
  <text
    x="90" y="51"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="400"
    font-size="9"
    letter-spacing="7"
    fill="#C9A84C"
    opacity="0.75"
  >EVENTS</text>
</svg>
