<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <!--
    ELBOLD PRIMARY LOGO — Final Direction (Concept B: Celebration Luxury)
    Starburst mark + wordmark. Navy on transparent.
    Use on white or light backgrounds.
  -->

  <!-- Starburst: 8 primary rays -->
  <line x1="32" y1="32" x2="32" y2="4"    stroke="#D4AF37" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="52" y2="12"   stroke="#D4AF37" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="60" y2="32"   stroke="#D4AF37" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="52" y2="52"   stroke="#D4AF37" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="32" y2="60"   stroke="#D4AF37" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="12" y2="52"   stroke="#D4AF37" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="4"  y2="32"   stroke="#D4AF37" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="12" y2="12"   stroke="#D4AF37" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>

  <!-- Starburst: 8 secondary rays (shorter) -->
  <line x1="32" y1="32" x2="32" y2="14"   stroke="#D4AF37" stroke-width="0.65" stroke-linecap="round" opacity="0.38"/>
  <line x1="32" y1="32" x2="45" y2="19"   stroke="#D4AF37" stroke-width="0.65" stroke-linecap="round" opacity="0.38"/>
  <line x1="32" y1="32" x2="50" y2="32"   stroke="#D4AF37" stroke-width="0.65" stroke-linecap="round" opacity="0.38"/>
  <line x1="32" y1="32" x2="45" y2="45"   stroke="#D4AF37" stroke-width="0.65" stroke-linecap="round" opacity="0.38"/>
  <line x1="32" y1="32" x2="32" y2="50"   stroke="#D4AF37" stroke-width="0.65" stroke-linecap="round" opacity="0.38"/>
  <line x1="32" y1="32" x2="19" y2="45"   stroke="#D4AF37" stroke-width="0.65" stroke-linecap="round" opacity="0.38"/>
  <line x1="32" y1="32" x2="14" y2="32"   stroke="#D4AF37" stroke-width="0.65" stroke-linecap="round" opacity="0.38"/>
  <line x1="32" y1="32" x2="19" y2="19"   stroke="#D4AF37" stroke-width="0.65" stroke-linecap="round" opacity="0.38"/>

  <!-- Centre disc -->
  <circle cx="32" cy="32" r="14"   fill="#0B1F4D"/>
  <circle cx="32" cy="32" r="13.3" stroke="#D4AF37" stroke-width="0.5" fill="none" opacity="0.3"/>

  <!-- EB monogram -->
  <text
    x="32" y="37"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-weight="700"
    font-size="13"
    letter-spacing="1.5"
    fill="#D4AF37"
  >EB</text>

  <!-- ELBOLD wordmark -->
  <text
    x="80" y="26"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="20"
    letter-spacing="4.5"
    fill="#0B1F4D"
  >ELBOLD</text>

  <!-- Thin rule -->
  <line x1="80" y1="32" x2="238" y2="32" stroke="#D4AF37" stroke-width="0.4" opacity="0.35"/>

  <!-- EVENTS subtitle -->
  <text
    x="80" y="46"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="400"
    font-size="8"
    letter-spacing="6.5"
    fill="#C9A84C"
    opacity="0.8"
  >EVENTS</text>
</svg>
