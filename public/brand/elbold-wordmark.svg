<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" fill="none">
  <!-- Mark badge (navy background) -->
  <rect width="44" height="44" rx="8" fill="#0B1F4D"/>
  <!-- Gold circle frame -->
  <circle cx="22" cy="26" r="12" stroke="#D4AF37" stroke-width="1.3" fill="none"/>
  <!-- Crown rays -->
  <line x1="22" y1="5" x2="22" y2="12" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="8.5" x2="16" y2="14" stroke="#D4AF37" stroke-width="1.1" stroke-linecap="round" opacity="0.6"/>
  <line x1="30" y1="8.5" x2="28" y2="14" stroke="#D4AF37" stroke-width="1.1" stroke-linecap="round" opacity="0.6"/>
  <!-- EB monogram -->
  <text x="22" y="31" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="11" letter-spacing="1.5" fill="#D4AF37">EB</text>
  <!-- ELBOLD wordmark — navy on white context -->
  <text x="58" y="30" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="18" letter-spacing="4" fill="#0B1F4D">ELBOLD</text>
</svg>
