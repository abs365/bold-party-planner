<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <!--
    CONCEPT B — CELEBRATION LUXURY
    Philosophy: The mark becomes a celebration starburst — a champagne
    explosion of light rays emanating from the EB centre, evoking
    fireworks, sparkle, and the magic moment of a great event.
    Inspired by Moet & Chandon, Veuve Clicquot.
  -->

  <!-- Starburst rays — 16 rays at regular 22.5° intervals -->
  <!-- 8 primary rays (longer) -->
  <line x1="32" y1="32" x2="32" y2="5"  stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="51.1" y2="12.9" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="59" y2="32" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="51.1" y2="51.1" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="32" y2="59" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="12.9" y2="51.1" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="5" y2="32" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="32" x2="12.9" y2="12.9" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>

  <!-- 8 secondary rays (shorter, interspersed) -->
  <line x1="32" y1="32" x2="32" y2="14"  stroke="#D4AF37" stroke-width="0.6" stroke-linecap="round" opacity="0.4"/>
  <line x1="32" y1="32" x2="45.3" y2="18.7" stroke="#D4AF37" stroke-width="0.6" stroke-linecap="round" opacity="0.4"/>
  <line x1="32" y1="32" x2="50" y2="32" stroke="#D4AF37" stroke-width="0.6" stroke-linecap="round" opacity="0.4"/>
  <line x1="32" y1="32" x2="45.3" y2="45.3" stroke="#D4AF37" stroke-width="0.6" stroke-linecap="round" opacity="0.4"/>
  <line x1="32" y1="32" x2="32" y2="50" stroke="#D4AF37" stroke-width="0.6" stroke-linecap="round" opacity="0.4"/>
  <line x1="32" y1="32" x2="18.7" y2="45.3" stroke="#D4AF37" stroke-width="0.6" stroke-linecap="round" opacity="0.4"/>
  <line x1="32" y1="32" x2="14" y2="32" stroke="#D4AF37" stroke-width="0.6" stroke-linecap="round" opacity="0.4"/>
  <line x1="32" y1="32" x2="18.7" y2="18.7" stroke="#D4AF37" stroke-width="0.6" stroke-linecap="round" opacity="0.4"/>

  <!-- Centre disc — navy background -->
  <circle cx="32" cy="32" r="14" fill="#0B1F4D"/>
  <circle cx="32" cy="32" r="13.2" stroke="#D4AF37" stroke-width="0.5" fill="none" opacity="0.35"/>

  <!-- EB monogram — italic serif for celebration energy -->
  <text
    x="32" y="37"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-weight="700"
    font-size="13"
    letter-spacing="1.5"
    fill="#D4AF37"
  >EB</text>

  <!-- ELBOLD wordmark -->
  <text
    x="80" y="26"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="20"
    letter-spacing="4.5"
    fill="#0B1F4D"
  >ELBOLD</text>

  <!-- Diamond separator -->
  <text
    x="80" y="44"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="400"
    font-size="8"
    letter-spacing="6.5"
    fill="#C9A84C"
    opacity="0.85"
  >EVENTS</text>
</svg>
